<div class="registro-container">
  <div class="registro-card">
    <div class="registro-header">
      <h2>🐾 PeludOS</h2>
      <p>Crea tu cuenta para empezar</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="registro-form">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" required />
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" [(ngModel)]="correo" name="correo" placeholder="tu@correo.com" required />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" [(ngModel)]="contrasena" name="contrasena" placeholder="••••••••" required />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono (opcional)</label>
        <input type="text" id="telefono" [(ngModel)]="telefono" name="telefono" placeholder="3001234567" />
      </div>

      <div class="form-group">
        <label for="direccion">Dirección (opcional)</label>
        <input type="text" id="direccion" [(ngModel)]="direccion" name="direccion" placeholder="Calle principal..." />
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <div class="registro-footer">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
