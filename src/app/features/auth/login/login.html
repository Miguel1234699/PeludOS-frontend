<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>🐾 PeludOS</h2>
      <p>Inicia sesión en tu cuenta</p>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" [(ngModel)]="correo" name="correo" placeholder="tu@correo.com" required />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" [(ngModel)]="contrasena" name="contrasena" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-submit">Ingresar</button>
    </form>

    <div class="login-footer">
      <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
    </div>
  </div>
</div>
